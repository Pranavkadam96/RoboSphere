<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#edf6f7" />
  <title>Weatherly — A clearer forecast</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #edf6f7;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-strong: #ffffff;
      --text: #17333a;
      --muted: #6b8387;
      --line: #dcebec;
      --accent: #159a9c;
      --accent-deep: #087b85;
      --accent-soft: #d8f3ef;
      --sun: #f6b73c;
      --shadow: 0 22px 60px rgba(29, 92, 97, 0.13);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #112326;
        --surface: rgba(28, 50, 54, 0.88);
        --surface-strong: #20383c;
        --text: #e8f5f3;
        --muted: #9eb8b9;
        --line: #345155;
        --accent: #53d2c4;
        --accent-deep: #8be9dd;
        --accent-soft: #244b4c;
        --sun: #ffd27a;
        --shadow: 0 22px 60px rgba(0, 0, 0, 0.22);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 0%, rgba(117, 221, 206, 0.2), transparent 32rem),
        radial-gradient(circle at 90% 90%, rgba(246, 183, 60, 0.12), transparent 24rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    main { width: min(100% - 32px, 760px); margin: 0 auto; padding: 42px 0 56px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 20px; box-shadow: 0 8px 18px rgba(21, 154, 156, 0.26); }
    .eyebrow { margin: 0 0 3px; color: var(--accent-deep); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); line-height: 1.08; letter-spacing: -0.05em; }
    .search { display: flex; gap: 8px; margin-bottom: 22px; }
    .search input { min-width: 0; flex: 1; border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; color: var(--text); background: var(--surface-strong); font: inherit; outline: none; transition: border .2s, box-shadow .2s; }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(21, 154, 156, .14); }
    button { border: 0; border-radius: 14px; padding: 0 18px; color: #fff; background: var(--accent); font: inherit; font-weight: 750; cursor: pointer; transition: transform .2s, background .2s; }
    button:hover { background: var(--accent-deep); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .65; transform: none; }
    .current { position: relative; overflow: hidden; display: grid; grid-template-columns: 1.2fr .8fr; gap: 20px; min-height: 235px; padding: 26px; border: 1px solid rgba(255,255,255,.44); border-radius: 24px; background: linear-gradient(135deg, rgba(216,243,239,.92), rgba(255,255,255,.84)); box-shadow: var(--shadow); }
    @media (prefers-color-scheme: dark) { .current { background: linear-gradient(135deg, #1d4a4a, #20383c); } }
    .current::after { content: ""; position: absolute; width: 220px; height: 220px; right: -55px; top: -78px; border-radius: 50%; background: rgba(255, 255, 255, .2); }
    .current-copy { position: relative; z-index: 1; }
    .location { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-weight: 750; }
    .location small { color: var(--muted); font-weight: 600; }
    .condition { margin: 0; color: var(--muted); font-weight: 650; }
    .temp { margin: 6px 0 2px; font-size: clamp(60px, 14vw, 92px); line-height: .95; letter-spacing: -.08em; font-weight: 800; }
    .temp span { margin-left: 4px; color: var(--accent-deep); font-size: .35em; vertical-align: top; letter-spacing: -.04em; }
    .metrics { display: flex; gap: 14px; margin-top: 18px; color: var(--muted); font-size: 13px; }
    .metrics strong { display: block; color: var(--text); font-size: 14px; }
    .weather-art { position: relative; z-index: 1; display: grid; place-items: center; align-content: center; }
    .weather-icon { font-size: 92px; filter: drop-shadow(0 10px 10px rgba(28, 87, 90, .12)); }
    .updated { margin: 14px 3px 0; color: var(--muted); font-size: 12px; }
    .section-heading { display: flex; justify-content: space-between; align-items: baseline; margin: 31px 2px 12px; }
    h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .section-heading span { color: var(--muted); font-size: 12px; }
    .forecast { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
    .day { padding: 16px 8px 14px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); text-align: center; box-shadow: 0 8px 22px rgba(29, 92, 97, .05); }
    .day-name { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
    .day-icon { display: block; margin: 11px 0 8px; font-size: 27px; }
    .temps { display: flex; justify-content: center; gap: 5px; font-weight: 800; }
    .temps .low { color: var(--muted); font-weight: 600; }
    .error { min-height: 20px; margin: 8px 2px 0; color: #c15548; font-size: 13px; }
    footer { margin-top: 34px; color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 540px) {
      main { padding-top: 25px; }
      .topbar { margin-bottom: 22px; }
      .current { grid-template-columns: 1fr .55fr; padding: 21px; }
      .weather-icon { font-size: 67px; }
      .metrics { gap: 9px; }
      .forecast { gap: 6px; }
      .day { padding: 13px 3px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">☼</span><span>Weatherly</span></div>
      <p class="eyebrow">Live forecast</p>
    </header>

    <div class="search" role="search">
      <input id="cityInput" type="search" value="Tokyo" placeholder="Search a city…" aria-label="Search for a city" />
      <button id="searchButton" type="button">Search</button>
    </div>
    <p class="error" id="error" role="status" aria-live="polite"></p>

    <section class="current" aria-labelledby="location">
      <div class="current-copy">
        <div class="location"><span id="location">Tokyo</span><small id="country">Japan</small></div>
        <p class="condition" id="condition">Loading the latest conditions…</p>
        <div class="temp"><span id="temperature">--</span><span>°C</span></div>
        <div class="metrics">
          <div>Feels like<strong id="feels">--°</strong></div>
          <div>Wind<strong id="wind">-- km/h</strong></div>
          <div>Humidity<strong id="humidity">--%</strong></div>
        </div>
      </div>
      <div class="weather-art"><span class="weather-icon" id="weatherIcon" aria-hidden="true">🌤️</span></div>
    </section>
    <p class="updated" id="updated">Checking Open-Meteo…</p>

    <div class="section-heading"><h2>5-day forecast</h2><span>High / low</span></div>
    <section class="forecast" id="forecast" aria-label="Five day forecast"></section>

    <footer>Powered by Open-Meteo · Weather can change quickly, stay curious.</footer>
  </main>

  <script>
    const fallback = {
      name: "Tokyo", country: "Japan", temperature: 22, feels: 22, wind: 12, humidity: 62,
      code: 2, dates: ["Mon", "Tue", "Wed", "Thu", "Fri"], highs: [24, 23, 25, 22, 21], lows: [17, 16, 18, 15, 14], codes: [2, 3, 1, 61, 2]
    };
    const $ = (id) => document.getElementById(id);
    const weather = {
      0: ["Clear sky", "☀️"], 1: ["Mostly clear", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"],
      45: ["Foggy", "🌫️"], 48: ["Foggy", "🌫️"], 51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy drizzle", "🌧️"],
      61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"], 71: ["Light snow", "🌨️"], 73: ["Snow", "❄️"],
      75: ["Heavy snow", "❄️"], 80: ["Rain showers", "🌦️"], 81: ["Rain showers", "🌧️"], 82: ["Heavy showers", "⛈️"],
      95: ["Thunderstorm", "⛈️"], 96: ["Stormy", "⛈️"], 99: ["Stormy", "⛈️"]
    };
    const getWeather = (code) => weather[code] || ["Variable conditions", "🌤️"];
    const dayName = (date, index) => index === 0 ? "Today" : new Date(`${date}T12:00:00`).toLocaleDateString(undefined, { weekday: "short" });

    function render(data, isFallback = false) {
      $("location").textContent = data.name;
      $("country").textContent = data.country;
      $("temperature").textContent = Math.round(data.temperature);
      $("feels").textContent = `${Math.round(data.feels)}°`;
      $("wind").textContent = `${Math.round(data.wind)} km/h`;
      $("humidity").textContent = `${Math.round(data.humidity)}%`;
      $("condition").textContent = getWeather(data.code)[0];
      $("weatherIcon").textContent = getWeather(data.code)[1];
      $("updated").textContent = isFallback ? "Showing a sample forecast · Live data unavailable" : `Updated just now · ${data.timezone}`;
      $("forecast").innerHTML = data.dates.map((date, i) => {
        const [label, icon] = getWeather(data.codes[i]);
        return `<article class="day" title="${label}"><span class="day-name">${dayName(date, i)}</span><span class="day-icon" aria-hidden="true">${icon}</span><div class="temps"><span>${Math.round(data.highs[i])}°</span><span class="low">${Math.round(data.lows[i])}°</span></div></article>`;
      }).join("");
    }

    async function searchCity(city) {
      const query = city.trim() || "Tokyo";
      $("searchButton").disabled = true;
      $("error").textContent = "";
      $("condition").textContent = "Finding your forecast…";
      try {
        const geoResponse = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
        if (!geoResponse.ok) throw new Error("Location search failed");
        const geo = await geoResponse.json();
        if (!geo.results?.length) throw new Error(`We couldn't find “${query}”.`);
        const place = geo.results[0];
        const forecastResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`);
        if (!forecastResponse.ok) throw new Error("Forecast request failed");
        const result = await forecastResponse.json();
        render({
          name: place.name, country: place.country || place.country_code, timezone: result.timezone,
          temperature: result.current.temperature_2m, feels: result.current.apparent_temperature, wind: result.current.wind_speed_10m, humidity: result.current.relative_humidity_2m, code: result.current.weather_code,
          dates: result.daily.time, highs: result.daily.temperature_2m_max, lows: result.daily.temperature_2m_min, codes: result.daily.weather_code
        });
      } catch (error) {
        render(fallback, true);
        $("error").textContent = error.message.includes("couldn't find") ? error.message : "Live data is taking a break, so here’s a reliable sample forecast.";
      } finally {
        $("searchButton").disabled = false;
      }
    }

    $("searchButton").addEventListener("click", () => searchCity($("cityInput").value));
    $("cityInput").addEventListener("keydown", (event) => { if (event.key === "Enter") searchCity($("cityInput").value); });
    searchCity("Tokyo");
  </script>
</body>
</html>
